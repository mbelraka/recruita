name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      lockfile: ${{ steps.filter.outputs.lockfile }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'patches/**'
              - 'scripts/check-one-definition-per-file.cjs'
              - 'scripts/check-one-definition-per-file.sh'
              - 'scripts/check-no-magic-values.cjs'
              - 'scripts/check-no-magic-values.sh'
            backend:
              - 'backend/**'
              - 'scripts/check-one-definition-per-file.cjs'
              - 'scripts/check-one-definition-per-file.sh'
              - 'scripts/check-no-magic-values.cjs'
              - 'scripts/check-no-magic-values.sh'
            lockfile:
              - 'package.json'
              - 'package-lock.json'

  lockfile:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.lockfile == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-toolchain
      - name: Verify package-lock.json matches package.json
        run: ./scripts/bin/npm run lockfile:check

  frontend:
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.lockfile == 'true' ||
      github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-toolchain
        with:
          cache-npm: true
          npm-ci: true
      - name: Engineering standards
        run: ./scripts/bin/npm run check:standards:frontend
      - name: Frontend CI
        run: ./scripts/bin/npm run validate:ci:frontend
      - name: Frontend a11y e2e
        run: ./scripts/bin/npm run e2e:install -w @recruita/frontend && ./scripts/bin/npm run a11y:e2e -w @recruita/frontend

  backend:
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.backend == 'true' ||
      github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-toolchain
        with:
          npm-ci: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version-file: backend/.java-version
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            backend/.mvn/wrapper/maven-wrapper.properties
      - name: Engineering standards
        run: ./scripts/bin/npm run check:standards:backend
      - name: Backend CI
        run: ./scripts/bin/npm run validate:ci:backend
      - name: Validate OpenAPI drift (springdoc vs contract)
        env:
          GROQ_API_KEY: ci-openapi-validation-key
        run: ./scripts/bin/npm run validate:openapi:drift
